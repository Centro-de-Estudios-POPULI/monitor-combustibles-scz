name: Scrape saldos (cada 30 min)

on:
  schedule:
    # GitHub coalesce/retrasa crons; minutos desfasados (no en :00) para mejorar fiabilidad.
    # OJO: el scheduler de GitHub es poco fiable; el disparo real lo hace un pinger externo
    # (cron-job.org -> API workflow_dispatch). Este cron queda como respaldo.
    - cron: "7,37 * * * *"   # ~cada 30 min (UTC)
  workflow_dispatch:        # permite ejecutarlo a mano (y lo usa el pinger externo)

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar scraper
        run: python scraper/scrape.py

      - name: Commit de datos
        run: |
          git config user.name  "populi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
            exit 0
          fi
          git commit -m "datos: snapshot $(date -u +'%Y-%m-%d %H:%M UTC')"
          # Otro run (scheduler/pinger) pudo avanzar el remoto entre medias: reintenta
          # rebaseando nuestro snapshot encima (los datos son regenerables; ante conflicto
          # ganan los nuestros). Evita el 'rejected (fetch first)' de runs solapados.
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push rechazado (intento $i); rebaseando sobre origin/main…"
            git pull --rebase -X theirs origin main || git rebase --abort
            sleep $(( (RANDOM % 5) + 2 ))
          done
          echo "::error::No se pudo pushear el snapshot tras 5 intentos"
          exit 1

      # Se ejecuta DESPUES del commit (los datos ya quedaron guardados): si una fuente
      # lleva sin datos frescos mas del umbral, pone el run en ROJO -> GitHub notifica.
      # Asi un outage/migracion de la fuente no vuelve a pasar semanas inadvertido.
      - name: Verificar salud de datos
        run: |
          python - <<'PY'
          import json, sys
          h = json.load(open('docs/data/health.json'))
          alertas = h.get('alertas') or []
          if alertas:
              for a in alertas:
                  print(f"::error::{a}")
              sys.exit(1)
          print("Salud OK:", {m: v['alerta'] for m, v in h.get('marcas', {}).items()})
          PY
